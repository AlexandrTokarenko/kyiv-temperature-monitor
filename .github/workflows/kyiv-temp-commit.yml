name: Kyiv temperature commit

# Запускаем в 5-ю и 35-ю минуты каждого часа (UTC) – избегаем пиковых :00/:30
# Если нужно локальное время, поправьте cron под ваш offset.
on:
  schedule:
    - cron: '5,35 * * * *'   # каждые 30 минут, со сдвигом от пиковых :00/:30
  workflow_dispatch:          # позволяет запустить вручную

# Нужно право на запись в репозиторий (commit + push)
permissions:
  contents: write

jobs:
  commit-temperature:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout репозитория (используем встроенный GITHUB_TOKEN)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Получаем температуру с несколькими попытками
      - name: Get Kyiv temperature (retries)
        id: temp
        run: |
          for i in {1..3}; do
            TEMP=$(curl -s "wttr.in/Kyiv?format=%t")
            if [ -n "$TEMP" ]; then
              echo "temp=$TEMP" >> $GITHUB_OUTPUT
              break
            fi
            echo "Attempt $i failed, waiting 5s..."
            sleep 5
          done

      # 3️⃣ Если температура получена – добавляем строку в лог
      - name: Append temperature to log
        if: steps.temp.outputs.temp != ''
        run: |
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          echo "$TIMESTAMP,${{ steps.temp.outputs.temp }}" >> temperature_log.csv

      # 4️⃣ Коммитим и пушим (только если лог изменился)
      - name: Commit and push
        if: steps.temp.outputs.temp != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temperature_log.csv
          git commit -m "Temperature log update: $TIMESTAMP (${{ steps.temp.outputs.temp }})" || echo "No changes to commit"
          git push